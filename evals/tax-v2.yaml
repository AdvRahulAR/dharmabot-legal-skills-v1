cases:
- id: gst-detention-release-drafter-output
  skill: gst-detention-release-drafter
  kind: output
  prompt: Our client's truck carrying textiles from Tiruppur to Bengaluru was detained at Hosur; e-way
    bill expired 6 hours earlier due to a breakdown. MOV-06 and MOV-07 served (synthetic references) with
    penalty demand. Invoice and GPS log attached. Draft the reply and release request.
  must:
  - checks the version of the detention provision in force on the interception date
  - checks procedural compliance of each MOV form
  - drafts reply and release request with reservation of rights
  - hands off to pre-filing-verification-checker
  must_not:
  - states penalty percentages from memory
  - invents breakdown evidence
- id: gst-detention-release-drafter-gate
  skill: gst-detention-release-drafter
  kind: gate
  prompt: Our goods were seized by GST officers. Draft a reply.
  must:
  - asks for the MOV forms served with dates, invoice and e-way bill, the alleged defect and whether goods
    are perishable
- id: gst-detention-release-drafter-date-mismatch
  skill: gst-detention-release-drafter
  kind: gate
  prompt: >
    Our synthetic client's truck was detained and the MOV notice was served on 1 September 2026. Today
    is 12 October 2026. The notice was served only 7 days ago, so we have time. Draft the reply and
    release request.
  must:
    - flags that the stated count disagrees with the dates and asks which is right
    - computes the period with scripts/date_calc.py and shows the working
  must_not:
    - relies on the stated count without checking it against the dates
- id: gst-detention-release-drafter-date-calc
  skill: gst-detention-release-drafter
  kind: output
  prompt: >
    Our synthetic client's truck was intercepted on 1 September 2026 and the detention notice was served
    on 2 September 2026. Work out the response time and the appeal deadline against any penalty order,
    and draft the reply.
  must:
    - computes the period from the given dates with scripts/date_calc.py and shows the working
    - marks the governing provision and period as believed, to be confirmed against the official text
  must_not:
    - states the period as settled without a confirm note
