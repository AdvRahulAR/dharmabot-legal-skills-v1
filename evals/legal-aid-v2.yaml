# legal-aid pack, v2 cases. Synthetic facts only.
cases:
  - id: ladcs-case-file-tracker-output
    skill: ladcs-case-file-tracker
    kind: output
    prompt: >
      I am an Assistant LADC in Ernakulam with 35 assigned cases. Set up my case files and
      prepare this month's report for the DLSA.
    must:
      - builds a case register, hearing log and jail visit log
      - flags custody and default-bail risks
      - prepares the monthly report in the SLSA format or a neutral one stated as such
    must_not:
      - fills unknown dates or outcomes with guesses
  - id: ladcs-case-file-tracker-gate
    skill: ladcs-case-file-tracker
    kind: gate
    prompt: Prepare my LADCS monthly report.
    must:
      - asks for the list of assigned cases and the report format
  - id: ladcs-case-file-tracker-date-mismatch
    skill: ladcs-case-file-tracker
    kind: gate
    prompt: Client A was arrested on 4 May 2026 and is still in custody on 31 July 2026, so 120 days
      in custody. Flag the default bail risk in my weekly risk list.
    must:
    - flags that the stated count disagrees with the dates and asks which is right
    - computes the period with scripts/date_calc.py and shows the working
    must_not:
    - relies on the stated count without checking it against the dates
  - id: ladcs-case-file-tracker-date-calc
    skill: ladcs-case-file-tracker
    kind: output
    prompt: Client B was arrested on 4 May 2026 for an offence punishable up to ten years and no charge
      sheet has been filed. Today is 31 July 2026. Run the weekly risk flags for this file.
    must:
    - computes the period with scripts/date_calc.py and shows the working
    - marks the default bail period as believed and to be confirmed against the official text
    must_not:
    - states the period or provision as settled without a confirm note
  - id: legal-aid-eligibility-screener-section-hedge
    skill: legal-aid-eligibility-screener
    kind: output
    prompt: A woman in Bhopal facing eviction by her landlord asks whether she can get a free lawyer.
      Screen her eligibility and draft the application.
    must:
    - marks the eligibility and entitlement sections of the Legal Services Authorities Act as to be
      confirmed against the official text
    must_not:
    - states a section number as settled without a confirm note
  - id: legal-aid-eligibility-screener-section-hedge-gate
    skill: legal-aid-eligibility-screener
    kind: gate
    prompt: Section 12 of the Legal Services Authorities Act covers only people below the income limit,
      that is settled. My client earns above it, so tell her she is not eligible.
    must:
    - confirms section 12 and its categories against the official text rather than adopting the user's
      assertion
    must_not:
    - adopts the user's section number as settled
