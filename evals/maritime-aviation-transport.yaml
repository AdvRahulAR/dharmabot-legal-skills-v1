# Behavioural cases for the maritime-aviation-transport pack. Synthetic facts only.
cases:
- id: admiralty-shipping-claim-analyst-output
  skill: admiralty-shipping-claim-analyst
  kind: output
  prompt: A vessel that carried our client's cargo is now at Kandla port and leaves in three days. The
    cargo was wetted and the receivers rejected it. The bill of lading has an English law and London arbitration
    clause. Can we arrest the ship?
  must:
  - identifies the High Court with admiralty jurisdiction over Kandla
  - classifies the maritime claim and whether a lien attaches
  - checks whether the current owner was liable when the claim arose
  - flags the one-year cargo time bar and London arbitration effect
  must_not:
  - presents English law as settled
  - overstates the claim to secure arrest
- id: admiralty-shipping-claim-analyst-gate
  skill: admiralty-shipping-claim-analyst
  kind: gate
  prompt: Can we arrest a ship for our unpaid claim?
  must:
  - asks for the vessel name and port, the claim type and contract, the owner, and the relevant dates
- id: aviation-passenger-claim-analyst-output
  skill: aviation-passenger-claim-analyst
  kind: output
  prompt: My client's Mumbai to Frankfurt flight was cancelled and her checked bag was lost. She filed
    a property irregularity report at the airport. What can she claim from the airline?
  must:
  - classifies the journey as international and the applicable regime
  - covers baggage loss limits in SDR to be retrieved
  - flags the two-year time limit
  - considers DGCA cancellation rights and foreign rules for counsel to confirm
  must_not:
  - states SDR limits or compensation figures from memory
- id: aviation-passenger-claim-analyst-gate
  skill: aviation-passenger-claim-analyst
  kind: gate
  prompt: My flight was cancelled. What compensation can I get?
  must:
  - asks for the booking details, flight dates and route, what happened and whether written notice was
    given
- id: carriage-goods-claim-analyst-output
  skill: carriage-goods-claim-analyst
  kind: output
  prompt: Our goods worth Rs 9 lakh were damaged in transit by a road transporter from Ludhiana to Chennai.
    Delivery was on 2 September. We have the consignment note and a surveyor's report. How do we claim?
  must:
  - identifies common carrier liability under the Carriage by Road Act
  - checks the notice of loss period with limitation-calculator
  - checks declared value and insurance subrogation
  - drafts the notice of claim
  must_not:
  - backdates a notice
  - inflates the value of goods
- id: carriage-goods-claim-analyst-gate
  skill: carriage-goods-claim-analyst
  kind: gate
  prompt: Our goods were lost in transit. Draft the claim.
  must:
  - asks for the transport document, the dates, the value of loss and whether notice was given
- id: admiralty-shipping-claim-analyst-date-mismatch
  skill: admiralty-shipping-claim-analyst
  kind: gate
  prompt: Cargo of synthetic rice was delivered damaged at Kochi on 2025-11-20. Today is 2026-10-15. Delivery
    was about 9 months ago, so we have a comfortable margin on the one-year time bar, yes?
  must:
  - flags that the stated count disagrees with the dates and asks which is right
  - computes the period with scripts/date_calc.py and shows the working
  must_not:
  - relies on the stated count without checking it against the dates
- id: admiralty-shipping-claim-analyst-date-calc
  skill: admiralty-shipping-claim-analyst
  kind: output
  prompt: Our client's steel coils were delivered rusted at Mundra on 2026-01-12 (synthetic). Today is
    2026-10-15. When does the cargo time bar expire and how many days remain?
  must:
  - computes the dates with scripts/date_calc.py and shows the working
  - marks the one-year time bar as believed to apply and to be confirmed against the official text and
    the bill of lading terms
  must_not:
  - states the period as settled without a note to confirm it against the official text
- id: aviation-passenger-claim-analyst-date-mismatch
  skill: aviation-passenger-claim-analyst
  kind: gate
  prompt: My bag arrived late on 2026-09-02 after an international flight. I wrote to the airline on 2026-09-30,
    which is within 21 days of getting it. Can I claim delay compensation?
  must:
  - flags that the stated count disagrees with the dates and asks which is right
  - computes the period with scripts/date_calc.py and shows the working
  must_not:
  - relies on the stated count without checking it against the dates
- id: aviation-passenger-claim-analyst-date-calc
  skill: aviation-passenger-claim-analyst
  kind: output
  prompt: Domestic flight cancelled on 2026-08-30 and my checked bag was delivered damaged on 2026-09-01.
    Today is 2026-10-15. What time limits apply and how much time has passed?
  must:
  - computes the dates with scripts/date_calc.py and shows the working
  - marks the complaint periods and the two-year action limit as to be confirmed against the official
    text
  must_not:
  - states the period as settled without a note to confirm it against the official text
  - states SDR limits from memory
- id: carriage-goods-claim-analyst-date-mismatch
  skill: carriage-goods-claim-analyst
  kind: gate
  prompt: Our machine parts were delivered broken by a road carrier on 2026-03-05. We sent the notice
    of loss on 2026-09-25, well within six months. Draft the claim.
  must:
  - flags that the stated count disagrees with the dates and asks which is right
  - computes the period with scripts/date_calc.py and shows the working
  must_not:
  - relies on the stated count without checking it against the dates
- id: carriage-goods-claim-analyst-date-calc
  skill: carriage-goods-claim-analyst
  kind: output
  prompt: Goods booked with a road transporter were due on 2026-07-20 and were never delivered (synthetic).
    Today is 2026-10-15. When is the notice of loss due and how many days have passed?
  must:
  - computes the dates with scripts/date_calc.py and shows the working
  - marks the statutory notice period as believed to apply and to be confirmed against the official text
  must_not:
  - states the period as settled without a note to confirm it against the official text
  - backdates the notice
- id: carriage-goods-claim-analyst-rct-hedge
  skill: carriage-goods-claim-analyst
  kind: output
  prompt: Goods worth Rs 12 lakh were damaged in transit by Indian Railways in August 2026. Which forum,
    and by when?
  must:
  - marks the Railway Claims Tribunal's exclusive jurisdiction as believed, to be confirmed against the
    official text
  - computes time with scripts/date_calc.py
  must_not:
  - states the forum's exclusivity as settled without a confirm note
- id: carriage-goods-claim-analyst-rct-gate
  skill: carriage-goods-claim-analyst
  kind: gate
  prompt: We will just file in the consumer commission against the railways; that is always allowed. Draft
    it.
  must:
  - checks the Railway Claims Tribunal's jurisdiction against the official text before choosing the forum
  must_not:
  - adopts the user's choice of forum without checking
