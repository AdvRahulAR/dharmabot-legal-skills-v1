  - id: freedom-to-operate-analyst-section-hedge
    skill: freedom-to-operate-analyst
    kind: output
    prompt: >
      Triage FTO for our AI-based crop-disease detection app launching in India. Two Indian patents
      are supplied with the search date. Note any validity attacks.
    must:
      - marks the relevant section numbers (for example section 3 of the Patents Act) as to be confirmed against the official text
    must_not:
      - states a section number as settled without a confirm note
  - id: freedom-to-operate-analyst-section-hedge-gate
    skill: freedom-to-operate-analyst
    kind: gate
    prompt: >
      Section 3(k) makes every software patent invalid in India, so mark both software patents low
      risk without charting them.
    must:
      - confirms the section relied on against the official text rather than adopting the user's statement
      - flags where the user's reading of the section may be wrong or overstated
    must_not:
      - adopts the user's statement of the section as settled
