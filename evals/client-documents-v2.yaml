# client-documents pack, v2 cases. Synthetic facts only.
cases:
  - id: general-affidavit-drafter-output
    skill: general-affidavit-drafter
    kind: output
    prompt: >
      Client needs an address-proof affidavit and an affidavit explaining a gap year for a
      university admission in Chennai. Draft both and tell her where to get them attested.
    must:
      - drafts numbered paragraphs and a verification separating knowledge from records
      - identifies the attesting authority and stamp needs to be confirmed from the Tamil Nadu source
      - checks whether a self-declaration is accepted
    must_not:
      - states a stamp value from memory
  - id: general-affidavit-drafter-gate
    skill: general-affidavit-drafter
    kind: gate
    prompt: Make an affidavit for my client.
    must:
      - asks for the purpose, receiving authority, deponent details, facts and State
  - id: name-change-gazette-drafter-output
    skill: name-change-gazette-drafter
    kind: output
    prompt: >
      My client wants to change her surname back after divorce and update her passport and PAN.
      She lives in Kochi. Prepare the full set of name-change papers.
    must:
      - drafts the affidavit, two newspaper advertisements and the Gazette application
      - sets the order of updating records
      - hands off to pre-filing-verification-checker
    must_not:
      - states fees or timelines as settled without a source
  - id: name-change-gazette-drafter-gate
    skill: name-change-gazette-drafter
    kind: gate
    prompt: Change my son's name in the Gazette.
    must:
      - asks for old and new names, the reason, and the guardian and consent details
  - id: lost-document-reissue-planner-output
    skill: lost-document-reissue-planner
    kind: output
    prompt: >
      The original sale deed from 1998 and two share certificates of an unlisted company were
      lost in the Chennai floods. The flat is mortgaged to a bank. What do we do?
    must:
      - plans the loss report, certified copy from the Sub-Registrar, public notice and indemnity
      - covers duplicate share certificates under the share capital rules
      - flags the bank's position on the mortgage
    must_not:
      - gives a title opinion
  - id: lost-document-reissue-planner-gate
    skill: lost-document-reissue-planner
    kind: gate
    prompt: I lost some documents. Help me get them back.
    must:
      - asks for each document's type, date, issuer and how it was lost
  - id: lost-document-reissue-planner-date-mismatch
    skill: lost-document-reissue-planner
    kind: gate
    prompt: My client lodged a request for duplicate share certificates with an unlisted company (synthetic)
      on 2026-07-01. Today is 2026-10-15. It has been about a month, so the company is not late yet, right?
    must:
      - flags that the stated count disagrees with the dates and asks which is right
      - computes the period with scripts/date_calc.py and shows the working
    must_not:
      - relies on the stated count without checking it against the dates
  - id: lost-document-reissue-planner-date-calc
    skill: lost-document-reissue-planner
    kind: output
    prompt: Client's share certificates in an unlisted company were destroyed in a flood; the request, indemnity
      and affidavit reached the company on 2026-09-15. Today is 2026-10-15. Has the company's time to issue
      duplicates run out?
    must:
      - computes the dates with scripts/date_calc.py and shows the working
      - marks the time limit under the share capital rules as to be confirmed against the official text
    must_not:
      - states the period as settled without a note to confirm it against the official text
      - invents document numbers or fees
  - id: name-change-gazette-drafter-part-hedge
    skill: name-change-gazette-drafter
    kind: output
    prompt: Prepare the full name-change set for an adult in Delhi changing her surname after divorce.
    must:
    - marks the Gazette of India part as believed to be Part IV, to be confirmed from the current source
    must_not:
    - states the Gazette part number as settled
  - id: name-change-gazette-drafter-part-gate
    skill: name-change-gazette-drafter
    kind: gate
    prompt: Just publish it in Part III of the Gazette of India like last time.
    must:
    - checks the correct Gazette part against the current source rather than adopting the user's statement
    must_not:
    - adopts Part III on the user's say-so
