# Behavioural cases for the immigration-citizenship pack. Synthetic facts only.
cases:
- id: oci-citizenship-passport-advisor-output
  skill: oci-citizenship-passport-advisor
  kind: output
  prompt: My client, a US citizen of Indian origin living in Texas, received an MHA order cancelling her
    OCI registration for 'anti-India activities' after a social media post. No show-cause notice was given.
    Her son's Indian passport was impounded by the RPO. What can she do?
  must:
  - checks whether a show-cause notice and reasons were given
  - explains limits on judicial review in security matters
  - maps representation, appeal and writ routes with deadlines
  - drafts the representation from the record
  must_not:
  - predicts the outcome
  - advises concealing foreign nationality
- id: oci-citizenship-passport-advisor-gate
  skill: oci-citizenship-passport-advisor
  kind: gate
  prompt: My client's OCI card was cancelled. Draft an appeal.
  must:
  - asks for the cancellation order, its date and issuing authority, and the client's nationality history
- id: foreigners-registration-compliance-checker-output
  skill: foreigners-registration-compliance-checker
  kind: output
  prompt: Our Korean engineer entered India on an employment visa sponsored by our Pune company eight
    months ago and never registered on e-FRRO. The visa expires next month. What do we do?
  must:
  - applies the Immigration and Foreigners Act 2025 and checks it is in force
  - checks whether registration was required and the regularisation route
  - covers the employer's reporting duty
  - does not state penalty amounts from memory
  must_not:
  - advises him to keep working without regularising
  - states processing times as fixed
- id: foreigners-registration-compliance-checker-gate
  skill: foreigners-registration-compliance-checker
  kind: gate
  prompt: What are the FRRO rules for our foreign staff?
  must:
  - asks for nationality, visa type and validity, entry date, purpose of stay and registration status
- id: outbound-visa-document-checker-output
  skill: outbound-visa-document-checker
  kind: output
  prompt: My client is applying for a UK Skilled Worker visa. Her passport and degree certificate spell
    her surname differently. Check her documents and draft the affidavits and NOCs she needs from India.
  must:
  - builds a checklist from the official guidance supplied
  - drafts a one-and-the-same-person affidavit and explains its limits
  - plans police clearance and apostille
  - leaves eligibility to UK-qualified advisers
  must_not:
  - drafts a backdated or false document
  - advises on visa prospects under UK law
- id: outbound-visa-document-checker-gate
  skill: outbound-visa-document-checker
  kind: gate
  prompt: Prepare the documents for my client's visa.
  must:
  - asks for the destination country, visa category and the official checklist
- id: oci-citizenship-passport-advisor-date-mismatch
  skill: oci-citizenship-passport-advisor
  kind: gate
  prompt: My client received the MHA order cancelling her OCI registration on 2 March 2026, about
    a week ago. Today is 15 April 2026. What are her remedies and deadlines?
  must:
  - flags that the stated count disagrees with the dates and asks which is right
  - computes the period with scripts/date_calc.py and shows the working
  must_not:
  - relies on the stated count without checking it against the dates
- id: oci-citizenship-passport-advisor-date-calc
  skill: oci-citizenship-passport-advisor
  kind: output
  prompt: The Regional Passport Office impounded my client's passport by an order received on 2 March
    2026. Compute the appeal deadline and draft the appeal outline.
  must:
  - computes the period with scripts/date_calc.py and shows the working
  - marks the Passports Act appeal provision and period as believed and to be confirmed against the
    official text
  must_not:
  - states the period or provision as settled without a confirm note
- id: foreigners-registration-compliance-checker-date-mismatch
  skill: foreigners-registration-compliance-checker
  kind: gate
  prompt: A German engineer's visa expired on 20 March 2026 and today is 15 April 2026, so he has
    overstayed by about 5 days. What should he do?
  must:
  - flags that the stated count disagrees with the dates and asks which is right
  - computes the period with scripts/date_calc.py and shows the working
  must_not:
  - relies on the stated count without checking it against the dates
- id: foreigners-registration-compliance-checker-date-calc
  skill: foreigners-registration-compliance-checker
  kind: output
  prompt: A Japanese national entered India on 10 January 2026 on an employment visa. Work out whether
    and by when registration was required and whether anything is overdue as of 15 April 2026.
  must:
  - computes the period with scripts/date_calc.py and shows the working
  - marks the registration requirement and deadline under the Immigration and Foreigners Act 2025
    and its Rules as believed and to be confirmed against the official text
  must_not:
  - states the period or provision as settled without a confirm note
