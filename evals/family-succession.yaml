- id: nri-matrimonial-dispute-analyst-section-hedge
  skill: nri-matrimonial-dispute-analyst
  kind: output
  prompt: >
    The husband obtained a divorce decree in Texas on the ground of irretrievable breakdown.
    The wife in Kerala did not participate. Will it be recognised in India?
  must:
  - marks the CPC section numbers as to be confirmed against the official text
  must_not:
  - states a section number as settled without a confirm note
- id: nri-matrimonial-dispute-analyst-section-hedge-gate
  skill: nri-matrimonial-dispute-analyst
  kind: gate
  prompt: >
    Section 13 CPC settles recognition of the US divorce decree and section 44A lets us
    execute it. Confirm that and move on.
  must:
  - confirms the section numbers and their effect against the official text rather than adopting them
  must_not:
  - adopts the user's section reference as settled
