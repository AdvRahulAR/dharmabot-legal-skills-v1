# tribunal-practice pack, v2 cases. Synthetic facts only.
cases:
  - id: cestat-appeal-drafter-output
    skill: cestat-appeal-drafter
    kind: output
    prompt: >
      Commissioner (Appeals) Chennai confirmed a customs duty demand of Rs 4.2 crore on
      classification of imported sensors, with equal penalty. Order received 20 August 2026.
      Draft the CESTAT appeal with the pre-deposit working.
    must:
      - shows the pre-deposit arithmetic with the source of the percentage and cap
      - checks limitation with limitation-calculator
      - hands off to pre-filing-verification-checker
    must_not:
      - states the pre-deposit percentage as settled without a source
      - promises a result
  - id: cestat-appeal-drafter-gate
    skill: cestat-appeal-drafter
    kind: gate
    prompt: Draft a CESTAT appeal against a GST demand order.
    must:
      - says GST appeals are outside scope and routes to tax-appeal-grounds-drafter
  - id: sectoral-tribunal-appeal-drafter-output
    skill: sectoral-tribunal-appeal-drafter
    kind: output
    prompt: >
      A SEBI whole-time member order dated 1 October 2026 debars our client for two years and
      imposes a Rs 25 lakh penalty. Draft the SAT appeal and stay application.
    must:
      - follows the SAT procedure rules retrieved with source and date
      - drafts a stay application with prima facie case, balance of convenience and harm
      - marks section numbers as to be confirmed
    must_not:
      - promises a stay
  - id: sectoral-tribunal-appeal-drafter-gate
    skill: sectoral-tribunal-appeal-drafter
    kind: gate
    prompt: Draft an appeal to the tribunal against the regulator's order.
    must:
      - asks for the impugned order, regulator and date of receipt, or routes forum choice to regulatory-appeal-planner
  - id: oppression-mismanagement-petition-drafter-output
    skill: oppression-mismanagement-petition-drafter
    kind: output
    prompt: >
      My client holds 8 percent in a Hyderabad private company, was removed as director in
      June 2026 and diluted by a rights issue she was not told about. Draft an oppression
      petition with a waiver application.
    must:
      - tests eligibility against the statutory thresholds and drafts a waiver application
      - maps each act to a document and relief
      - drafts an interim application on status quo
    must_not:
      - invents meeting dates or shareholding figures
  - id: oppression-mismanagement-petition-drafter-gate
    skill: oppression-mismanagement-petition-drafter
    kind: gate
    prompt: Draft an NCLT oppression petition for my client.
    must:
      - asks for the company details, shareholding, acts complained of and documents
  - id: cestat-appeal-drafter-date-mismatch
    skill: cestat-appeal-drafter
    kind: gate
    prompt: The order-in-appeal was communicated to us on 4 May 2026. Today is 31 July 2026; it has
      only been 45 days, so limitation is no issue. Draft the CESTAT appeal.
    must:
    - flags that the stated count disagrees with the dates and asks which is right
    - computes the period with scripts/date_calc.py and shows the working
    must_not:
    - relies on the stated count without checking it against the dates
  - id: cestat-appeal-drafter-date-calc
    skill: cestat-appeal-drafter
    kind: output
    prompt: The order-in-original was communicated on 4 May 2026. If the CESTAT appeal period is three
      months, what is the last date? Then draft the appeal.
    must:
    - computes the period with scripts/date_calc.py and shows the working
    - marks the Customs Act appeal provision and period as believed and to be confirmed against the
      official text
    must_not:
    - states the period or provision as settled without a confirm note
  - id: sectoral-tribunal-appeal-drafter-date-mismatch
    skill: sectoral-tribunal-appeal-drafter
    kind: gate
    prompt: SEBI's order was received on 16 February 2026 and we plan to file at SAT on 1 June 2026,
      within 45 days of receipt. Draft the appeal.
    must:
    - flags that the stated count disagrees with the dates and asks which is right
    - computes the period with scripts/date_calc.py and shows the working
    must_not:
    - relies on the stated count without checking it against the dates
  - id: sectoral-tribunal-appeal-drafter-date-calc
    skill: sectoral-tribunal-appeal-drafter
    kind: output
    prompt: A SEBI adjudication order was received on 16 February 2026. Compute the SAT appeal deadline
      and draft the appeal with a stay application.
    must:
    - computes the period with scripts/date_calc.py and shows the working
    - marks the SEBI Act appeal provision and period as believed and to be confirmed against the official
      text
    must_not:
    - states the period or provision as settled without a confirm note
  - id: oppression-mismanagement-petition-drafter-date-mismatch
    skill: oppression-mismanagement-petition-drafter
    kind: gate
    prompt: The board allotted shares to dilute my client on 3 November 2025, about four months ago.
      We are filing on 15 October 2026. Address delay in the petition.
    must:
    - flags that the stated count disagrees with the dates and asks which is right
    - computes the period with scripts/date_calc.py and shows the working
    must_not:
    - relies on the stated count without checking it against the dates
  - id: oppression-mismanagement-petition-drafter-date-calc
    skill: oppression-mismanagement-petition-drafter
    kind: output
    prompt: The impugned allotment was on 3 November 2025 and we are filing on 15 October 2026. Work
      out the time elapsed and address limitation and delay in the NCLT petition.
    must:
    - computes the period with scripts/date_calc.py and shows the working
    - marks the Companies Act oppression sections and any limitation period as believed and to be confirmed
      against the official text
    must_not:
    - states the period or provision as settled without a confirm note
