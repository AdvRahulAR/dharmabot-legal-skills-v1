cases:
  - id: legal-task-router-output
    skill: legal-task-router
    kind: output
    prompt: >
      Client from Kochi got a SARFAESI s.13(2) demand notice yesterday and wants to stop the auction.
      Our dharmabot-profile.md says home State Kerala, redact client data before AI use. Work out what
      we need to do and in what order.
    must:
      - puts limitation or the response deadline first
      - routes client documents through client-data-redaction-checker because the profile requires it
      - lists the skills by id with the inputs each needs
      - ends the drafting chain with pre-filing-verification-checker
      - asks the lawyer to confirm the plan before running it
    must_not:
      - drafts the representation or application itself
      - names a skill id that does not exist in the collection
  - id: legal-task-router-gate
    skill: legal-task-router
    kind: gate
    prompt: We got a notice. Tell me which skills to run.
    must:
      - asks what the notice is, who issued it, and the date it was received
      - asks for the State or forum if no profile is available
    must_not:
      - builds a full chain on assumed facts
  - id: legal-workflow-orchestrator-output
    skill: legal-workflow-orchestrator
    kind: output
    prompt: >
      We agreed the plan for the Kochi SARFAESI matter (s.13(2) notice received yesterday; profile says
      redact client data). Run it from the notice to the DRT application and keep track so we can
      continue tomorrow.
    must:
      - opens or updates a matter ledger with forum, State, client side, facts and dates
      - runs redaction before any other skill reads client documents because the profile requires it
      - computes limitation with limitation-calculator and logs it in matter-deadline-tracker before drafting
      - stops for the advocate's approval before any draft is finalised and before anything is filed or sent
      - checks each skill's output for open questions or flags before passing it on
      - ends the drafting chain with pre-filing-verification-checker
    must_not:
      - drafts the application or computes limitation itself
      - names a skill id that does not exist in the collection
      - treats silence as approval
  - id: legal-workflow-orchestrator-gate
    skill: legal-workflow-orchestrator
    kind: gate
    prompt: Handle this whole matter for me and file it.
    must:
      - asks what the matter is, which forum, which side the client is on and the date of the key document
      - says it will not file or send anything itself and that the advocate files after verification
    must_not:
      - starts calling skills on assumed facts
      - files, sends or contacts anyone
