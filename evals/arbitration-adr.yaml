# Arbitration, Mediation and ADR pack cases. Synthetic facts only. See evals/README.md for format.
cases:
  - id: arbitration-clause-reviewer-output
    skill: arbitration-clause-reviewer
    kind: output
    prompt: >
      Review the arbitration clause in this franchise agreement between two Indian
      companies. It says disputes go to two arbitrators, one appointed by each party,
      venue Delhi, and courts at Jaipur have exclusive jurisdiction.
    must:
      - analyses whether Delhi is the seat or only the venue, given the Jaipur clause
      - flags the even number of arbitrators and suggests a presiding arbitrator
      - checks stamping of the main agreement and hands off to contract-execution-stamping-checker
      - gives repaired clause wording
    must_not:
      - states that the clause is definitely valid or invalid without analysis
      - invents a case citation
  - id: arbitration-clause-reviewer-gate
    skill: arbitration-clause-reviewer
    kind: gate
    prompt: >
      Review our arbitration clause with a Singapore distributor that says SIAC rules,
      seat Singapore.
    must:
      - identifies the clause as cross-border with a foreign seat
      - hands off to international-arbitration-planner instead of applying the domestic review

  - id: arbitration-invocation-notice-drafter-output
    skill: arbitration-invocation-notice-drafter
    kind: output
    prompt: >
      Draft a notice invoking arbitration against the contractor for delay damages
      under clause 25 of the EPC contract. Seat is Mumbai, sole arbitrator to be
      mutually agreed, and clause 24 requires 30 days of senior-management talks,
      which ended without settlement last month. Claim is Rs 3.4 crore.
    must:
      - quotes the arbitration clause and records compliance with the negotiation tier
      - proposes an arbitrator and asks for concurrence
      - includes a claims schedule with limitation notes and refers to limitation-calculator
      - states that the notice date matters for commencement under section 21, to be confirmed
    must_not:
      - invents figures beyond the Rs 3.4 crore given
      - threatens criminal proceedings
  - id: arbitration-invocation-notice-drafter-gate
    skill: arbitration-invocation-notice-drafter
    kind: gate
    prompt: Send an arbitration notice to the vendor for non-payment. I don't have the contract handy.
    must:
      - asks for the arbitration clause and contract before drafting
      - asks for the claim details, amounts and dates

  - id: section-9-interim-relief-drafter-output
    skill: section-9-interim-relief-drafter
    kind: output
    prompt: >
      Draft a section 9 petition in the Bombay High Court to stop the buyer from
      encashing our performance bank guarantee before arbitration starts. The seat is
      Mumbai. The buyer has issued an invocation letter claiming defects we dispute.
    must:
      - explains that unconditional guarantees are restrained only in narrow cases such as egregious fraud or special equities
      - notes the requirement to commence arbitration within a period after a pre-arbitral order, to be confirmed
      - hands off the follow-on notice to arbitration-invocation-notice-drafter
      - drafts prayers for interim and ad interim relief
    must_not:
      - promises that the court will grant an injunction
      - alleges fraud without supporting documents
  - id: section-9-interim-relief-drafter-gate
    skill: section-9-interim-relief-drafter
    kind: gate
    prompt: >
      The tribunal was constituted three months ago and is hearing the matter. Draft a
      section 9 petition in the Delhi High Court to freeze the respondent's accounts.
    must:
      - raises the section 9(3) bar once the tribunal is constituted
      - asks why the section 17 remedy is not efficacious or suggests applying to the tribunal

  - id: section-11-appointment-petition-drafter-output
    skill: section-11-appointment-petition-drafter
    kind: output
    prompt: >
      The respondent ignored our section 21 notice sent 45 days ago. Both parties are
      Bengaluru companies and the seat is Bengaluru. Draft the section 11 petition in
      the Karnataka High Court.
    must:
      - shows how the agreed appointment procedure failed
      - keeps the petition to prima facie existence of the arbitration agreement
      - addresses limitation for the petition and refers to limitation-calculator
      - includes a disclosure checklist for the proposed arbitrator
    must_not:
      - argues the full merits of the claim
      - predicts which arbitrator the court will appoint
  - id: section-11-appointment-petition-drafter-gate
    skill: section-11-appointment-petition-drafter
    kind: gate
    prompt: >
      Draft a section 11 petition in the Delhi High Court. The respondent is a German
      company and the seat is New Delhi.
    must:
      - identifies the matter as an international commercial arbitration
      - flags that the petition lies before the Supreme Court, not the High Court

  - id: arbitral-proceedings-drafter-output
    skill: arbitral-proceedings-drafter
    kind: output
    prompt: >
      Draft our statement of claim in this DIAC arbitration on unpaid running bills and
      price escalation under a building contract. We act for the contractor.
    must:
      - structures each claim as a separate head tied to a contract clause and evidence
      - checks DIAC rules and the statutory timelines for pleadings and award
      - refers interest and quantum to damages-interest-calculator
      - produces an exhibit list mapped to each claim
    must_not:
      - invents amounts or dates not in the record
  - id: arbitral-proceedings-drafter-gate
    skill: arbitral-proceedings-drafter
    kind: gate
    prompt: Draft a section 29A application to extend the arbitrator's mandate.
    must:
      - asks for the date the tribunal was constituted and when pleadings were completed
      - asks whether the parties consent to an extension

  - id: section-34-37-award-challenge-drafter-output
    skill: section-34-37-award-challenge-drafter
    kind: output
    prompt: >
      We lost a domestic award against a PSU. The tribunal ignored our delay notices and
      awarded liquidated damages. The signed award was received 70 days ago. Assess the
      grounds and draft a section 34 petition.
    must:
      - computes the remaining time and refers to limitation-calculator
      - tests each ground narrowly and warns that courts do not re-appreciate evidence
      - drafts a separate stay application with a deposit or security offer
      - maps award findings to paragraphs
    must_not:
      - guarantees that the award will be set aside
      - invents a case citation
  - id: section-34-37-award-challenge-drafter-gate
    skill: section-34-37-award-challenge-drafter
    kind: gate
    prompt: >
      Draft a section 34 petition. The award was received five months ago and we did not
      file anything yet.
    must:
      - flags that the period of three months plus the limited extension appears to have expired
      - does not draft as if the petition is within time

  - id: pre-institution-mediation-advisor-output
    skill: pre-institution-mediation-advisor
    kind: output
    prompt: >
      We want to file a commercial suit for Rs 1.2 crore in Chennai for unpaid invoices.
      There is no arbitration clause and no urgency. Do we need pre-institution
      mediation and how do we start it?
    must:
      - explains that section 12A mediation appears mandatory where no urgent interim relief is contemplated
      - drafts the PIMS application to the appropriate Legal Services Authority
      - checks the status of the Mediation Act 2023 provisions
      - notes exclusion of mediation time from limitation, to be confirmed
    must_not:
      - suggests pleading urgency to skip mediation
  - id: pre-institution-mediation-advisor-gate
    skill: pre-institution-mediation-advisor
    kind: gate
    prompt: Do I need pre-institution mediation before suing my supplier?
    must:
      - asks for the nature of the dispute, the claim value and the place of filing
      - asks whether urgent interim relief is needed

  - id: mediation-brief-drafter-output
    skill: mediation-brief-drafter
    kind: output
    prompt: >
      Prepare our confidential brief to the mediator and an opening statement for the
      court-annexed mediation in this partnership dispute in Kochi. Our client wants to
      exit the firm and be paid out for its capital.
    must:
      - produces a confidential brief separate from the internal negotiation sheet
      - maps the interests of both partners
      - gives a caucus disclosure plan
      - respects mediation confidentiality
    must_not:
      - suggests misleading the mediator about facts
  - id: mediation-brief-drafter-gate
    skill: mediation-brief-drafter
    kind: gate
    prompt: Write a mediation brief for tomorrow.
    must:
      - asks for the dispute summary, documents and the type of mediation
      - asks who the client is and who will attend with settlement authority

  - id: mediated-settlement-agreement-drafter-output
    skill: mediated-settlement-agreement-drafter
    kind: output
    prompt: >
      We settled a commercial dispute in mediation. The buyer will pay Rs 60 lakh in
      three instalments and the supplier will withdraw its pending commercial suit in
      Pune. Draft the mediated settlement agreement and tell me how it is enforced.
    must:
      - drafts a payment schedule and a default clause
      - ties withdrawal of the suit to payment
      - checks which Mediation Act 2023 provisions are in force
      - refers stamping to state-stamp-duty-calculator
    must_not:
      - adds terms the parties did not agree
  - id: mediated-settlement-agreement-drafter-gate
    skill: mediated-settlement-agreement-drafter
    kind: gate
    prompt: >
      Draft a settlement agreement. The parties also agreed that the cheating FIR will be
      withdrawn as part of the deal.
    must:
      - asks for the agreed terms, the parties and the list of pending cases
      - flags that a criminal case can be closed only through the forum's lawful procedure

  - id: settlement-strategy-planner-output
    skill: settlement-strategy-planner
    kind: output
    prompt: >
      The other side offered Rs 40 lakh to settle our Rs 1 crore claim pending in a
      commercial court for two years. Our counsel puts our chances on liability at about
      60 percent. Should we take it? Build our negotiation plan.
    must:
      - builds a scenario table with probability, net amount and time
      - uses the advocate's probability rather than its own
      - recommends opening, target and walk-away figures with reasons
      - leaves the decision to the client
    must_not:
      - tells the client definitively to accept or reject
  - id: settlement-strategy-planner-gate
    skill: settlement-strategy-planner
    kind: gate
    prompt: Is a settlement offer of Rs 15 lakh good?
    must:
      - asks for the claim, its basis and the forum and stage
      - asks for the client's priorities and the advocate's view of merits
  - id: arbitration-invocation-notice-drafter-date-mismatch
    skill: arbitration-invocation-notice-drafter
    kind: gate
    prompt: >
      Draft a notice invoking arbitration for Meridian Fabricators against Coastline Builders.
      The last unpaid invoice fell due on 2023-04-10. The client says the cause of action arose
      just under three years ago. Today is 2026-10-15.
    must:
      - flags that the stated count disagrees with the dates and asks which is right
      - computes the period with scripts/date_calc.py and shows the working
    must_not:
      - relies on the stated count without checking it against the dates
  - id: arbitration-invocation-notice-drafter-date-calc
    skill: arbitration-invocation-notice-drafter
    kind: output
    prompt: >
      Draft a notice invoking arbitration for Orbit Packaging against Delta Foods (seat Pune).
      The unpaid invoice of Rs 18 lakh fell due on 2024-02-01. The notice will be sent on
      2026-10-20.
    must:
      - computes the time elapsed from the cause of action to the notice date with scripts/date_calc.py and shows the working
      - states that the notice date is believed to be the commencement date and marks the provision to be confirmed
    must_not:
      - states the period as settled without a confirm note
  - id: section-9-interim-relief-drafter-date-mismatch
    skill: section-9-interim-relief-drafter
    kind: gate
    prompt: >
      The Commercial Court granted our client pre-arbitral interim relief under section 9 on
      2026-05-04. We have not yet sent a notice invoking arbitration. Today is 2026-08-20 and
      the client says we are well within the 90 days.
    must:
      - flags that the stated count disagrees with the dates and asks which is right
      - computes the period with scripts/date_calc.py and shows the working
    must_not:
      - relies on the stated count without checking it against the dates
  - id: section-9-interim-relief-drafter-date-calc
    skill: section-9-interim-relief-drafter
    kind: output
    prompt: >
      The court granted pre-arbitral interim relief to our client on 2026-09-01. Diarise the
      date by which arbitral proceedings must begin and draft the follow-on note.
    must:
      - computes the follow-on date with scripts/date_calc.py and shows the working
      - marks the 90-day requirement as believed and to be confirmed from the official text
    must_not:
      - states the period as settled without a confirm note
  - id: section-11-appointment-petition-drafter-date-mismatch
    skill: section-11-appointment-petition-drafter
    kind: gate
    prompt: >
      Our notice invoking arbitration and proposing a sole arbitrator was received by the
      respondent on 2026-06-01. Today is 2026-06-20 and the client says the respondent has had
      over 30 days to appoint. Draft the section 11 petition.
    must:
      - flags that the stated count disagrees with the dates and asks which is right
      - computes the period with scripts/date_calc.py and shows the working
    must_not:
      - relies on the stated count without checking it against the dates
  - id: section-11-appointment-petition-drafter-date-calc
    skill: section-11-appointment-petition-drafter
    kind: output
    prompt: >
      Our notice invoking arbitration was received by the respondent on 2026-03-02. There has
      been no reply. Today is 2026-10-15. Draft the section 11 petition with a limitation note.
    must:
      - computes the days elapsed since receipt of the notice with scripts/date_calc.py and shows the working
      - marks the appointment period and the limitation article as believed and to be confirmed
    must_not:
      - states the period as settled without a confirm note
  - id: arbitral-proceedings-drafter-date-mismatch
    skill: arbitral-proceedings-drafter
    kind: gate
    prompt: >
      Acting for the claimant. The tribunal received notice of its appointment on 2025-12-01.
      Today is 2026-08-28 and the client says we are about four months in, so there is no hurry
      on pleadings. Draft a timeline.
    must:
      - flags that the stated count disagrees with the dates and asks which is right
      - computes the period with scripts/date_calc.py and shows the working
    must_not:
      - relies on the stated count without checking it against the dates
  - id: arbitral-proceedings-drafter-date-calc
    skill: arbitral-proceedings-drafter
    kind: output
    prompt: >
      Acting for the tribunal secretary. The tribunal received notice of appointment on
      2026-01-15 and pleadings were completed on 2026-06-30. Draft PO1 with a timeline of
      statutory deadlines.
    must:
      - computes the pleadings and award deadlines with scripts/date_calc.py and shows the working
      - marks each statutory period as believed and to be confirmed from the official text
    must_not:
      - states the period as settled without a confirm note
  - id: section-34-37-award-challenge-drafter-date-mismatch
    skill: section-34-37-award-challenge-drafter
    kind: gate
    prompt: >
      We lost an arbitration seated in Mumbai. The signed award was received by our client on
      2026-06-02. Today is 2026-09-14 and the client says the award came about 60 days ago. Can
      we still file a section 34 petition?
    must:
      - flags that the stated count disagrees with the dates and asks which is right
      - computes the period with scripts/date_calc.py and shows the working
    must_not:
      - relies on the stated count without checking it against the dates
  - id: section-34-37-award-challenge-drafter-date-calc
    skill: section-34-37-award-challenge-drafter
    kind: output
    prompt: >
      We lost an arbitration seated in Chennai. The signed award was received on 2026-07-20 and
      no section 33 request was made. Give the last safe filing date for a section 34 petition.
    must:
      - computes the last date from the date of receipt with scripts/date_calc.py and shows the working
      - marks the three-month and thirty-day periods as believed and to be confirmed from the official text
    must_not:
      - states the period as settled without a confirm note
  - id: pre-institution-mediation-advisor-date-mismatch
    skill: pre-institution-mediation-advisor
    kind: gate
    prompt: >
      Our pre-institution mediation application was made to the DLSA on 2026-05-11. Today is
      2026-08-31 and the client says mediation has been going on for about a month, so there is
      plenty of time. Advise on the timeline and limitation.
    must:
      - flags that the stated count disagrees with the dates and asks which is right
      - computes the period with scripts/date_calc.py and shows the working
    must_not:
      - relies on the stated count without checking it against the dates
  - id: pre-institution-mediation-advisor-date-calc
    skill: pre-institution-mediation-advisor
    kind: output
    prompt: >
      PIMS application made on 2026-07-01; the mediation failed and the report is dated
      2026-09-15. The claim's cause of action arose on 2023-09-20. Advise on the limitation
      position for the commercial suit.
    must:
      - computes the mediation period and the limitation dates with scripts/date_calc.py and shows the working
      - marks the exclusion of mediation time from limitation as believed and to be confirmed
    must_not:
      - states the period as settled without a confirm note
  - id: arbitration-clause-reviewer-section-hedge
    skill: arbitration-clause-reviewer
    kind: output
    prompt: >
      Review this clause in a supply agreement between two Indian companies: 'Disputes shall be
      referred to a sole arbitrator appointed by the Buyer. Venue Hyderabad.' Explain the court
      fallback for appointment.
    must:
      - marks the relevant section numbers as to be confirmed against the official text
    must_not:
      - states a section number as settled without a confirm note
  - id: arbitration-clause-reviewer-section-hedge-gate
    skill: arbitration-clause-reviewer
    kind: gate
    prompt: >
      Review our arbitration clause. We know the court route is section 11 and the unilateral
      appointment bar is section 12(5), so just apply those as settled law.
    must:
      - confirms the section numbers against the official text rather than adopting them as settled
    must_not:
      - adopts the user's section reference as settled
  - id: mediated-settlement-agreement-drafter-section-hedge
    skill: mediated-settlement-agreement-drafter
    kind: output
    prompt: >
      The parties settled a pending recovery suit in court-referred mediation in Delhi. Draft
      the compromise terms and the application to record them.
    must:
      - marks the Order XXIII Rule 3 reference and other provisions as to be confirmed against the official text
    must_not:
      - states a section number as settled without a confirm note
  - id: mediated-settlement-agreement-drafter-section-hedge-gate
    skill: mediated-settlement-agreement-drafter
    kind: gate
    prompt: >
      Draft the settlement. Compromise is recorded under Order XXIII Rule 3 CPC and that is
      settled, so cite it as it is.
    must:
      - confirms the provision against the official text rather than adopting the user's statement as settled
    must_not:
      - adopts the user's section reference as settled
  - id: arbitral-proceedings-drafter-ica-29a
    skill: arbitral-proceedings-drafter
    kind: output
    prompt: Mumbai-seated arbitration between an Indian company and a Singapore company; pleadings closed
      on 10 January 2026. Prepare the timetable and tell me when the mandate ends.
    must:
    - identifies the matter as an international commercial arbitration
    - says the twelve-month award period is believed to be only an endeavour under the proviso to s.29A(1),
      to be confirmed
    - computes dates with scripts/date_calc.py
    must_not:
    - states that the mandate ends automatically twelve months after pleadings closed
  - id: arbitral-proceedings-drafter-domestic-29a-gate
    skill: arbitral-proceedings-drafter
    kind: gate
    prompt: Domestic arbitration between two Pune companies; I think the twelve months is only a target,
      so we can ignore it. Just draft the rejoinder.
    must:
    - confirms the s.29A period against the official text rather than adopting the user's reading
    - distinguishes a domestic arbitration from an international commercial arbitration
    must_not:
    - accepts that the twelve-month period is only a target for a domestic arbitration
