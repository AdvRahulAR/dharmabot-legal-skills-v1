# criminal-bnss pack, additional cases. Synthetic facts only.
cases:
  - id: criminal-complaint-drafter-output
    skill: criminal-complaint-drafter
    kind: output
    prompt: >
      In August 2025 my client paid Rs 9 lakh to a builder in Gurugram for a flat that
      never existed; the builder has disappeared. The police station refused to register
      an FIR on 3 September 2025. Draft the complaint to the SP and the Magistrate application.
    must:
      - maps each ingredient of cheating to a fact and a document
      - sequences police station, SP complaint, then Magistrate application with affidavit
      - marks BNSS section numbers as to be confirmed from the official text
    must_not:
      - adds offences or facts not in the instructions
      - invents a case citation
  - id: criminal-complaint-drafter-gate
    skill: criminal-complaint-drafter
    kind: gate
    prompt: Draft a s.175(3) BNSS application for my client. The police are not acting.
    must:
      - asks for the dated narrative, the accused and what each did, and the steps already taken
  - id: fir-quashing-petition-drafter-output
    skill: fir-quashing-petition-drafter
    kind: output
    prompt: >
      FIR dated 10 January 2025 in Ludhiana under BNS cheating and breach of trust provisions
      over unpaid invoices under a supply contract; an arbitration is already pending.
      Draft a quashing petition in the Punjab and Haryana High Court with a no-coercive-action prayer.
    must:
      - tests whether dishonest intention at inception appears on the face of the FIR
      - includes an interim prayer for no coercive action
      - tags unread authority [verify]
    must_not:
      - promises that the FIR will be quashed
  - id: fir-quashing-petition-drafter-gate
    skill: fir-quashing-petition-drafter
    kind: gate
    prompt: Charges have been framed and two prosecution witnesses examined. Draft a quashing petition anyway.
    must:
      - flags the stage and considers whether revision or another remedy fits better
      - asks for the FIR and the charge order
  - id: discharge-application-drafter-output
    skill: discharge-application-drafter
    kind: output
    prompt: >
      Sessions case in Pune, chargesheet filed March 2025 against four accused for an assault
      in December 2024. No witness statement names accused no. 4. Draft his discharge application.
    must:
      - works offence by offence and accused by accused with record references
      - relies only on the prosecution record
    must_not:
      - relies on defence documents as evidence at this stage
  - id: discharge-application-drafter-gate
    skill: discharge-application-drafter
    kind: gate
    prompt: Draft a discharge application; the offence was in 2023 and the case was committed in 2024.
    must:
      - addresses which code governs procedure, routing to crpc-bnss-transition-analyst
      - asks for the police report and the documents supplied
  - id: chargesheet-review-analyst-output
    skill: chargesheet-review-analyst
    kind: output
    requires_files: true
    prompt: 'Review this dowry death chargesheet (fixture) for the defence. The FIR was lodged nine days
      after death and the WhatsApp chats have no certificate.

      '
    must:
    - produces a record index, ingredient matrix and witness table with page references
    - flags the electronic evidence certificate issue and the delay
    must_not:
    - grades witness credibility beyond contradictions on the record

  - id: chargesheet-review-analyst-gate
    skill: chargesheet-review-analyst
    kind: gate
    prompt: List the gaps in the prosecution case. I only have the FIR, not the chargesheet.
    must:
      - asks for the full police report and annexed documents before a gap note
  - id: criminal-trial-readiness-checker-output
    skill: criminal-trial-readiness-checker
    kind: output
    prompt: >
      NDPS trial in Jaipur starts next month; seizure in October 2024, charge framed May 2025.
      Defence theory is non-compliance with search safeguards. Check readiness.
    must:
      - produces a checklist with status, owner and due date
      - lists admissibility objections and documents to summon
    must_not:
      - suggests coaching witnesses or delaying for its own sake
  - id: criminal-trial-readiness-checker-gate
    skill: criminal-trial-readiness-checker
    kind: gate
    prompt: Is our defence ready for trial? We have not seen the charge or the witness list yet.
    must:
      - asks for the charge, the police report and the prosecution witness list
  - id: sentencing-mitigation-analyst-output
    skill: sentencing-mitigation-analyst
    kind: output
    prompt: >
      Client, aged 24, convicted for causing death by negligence for a road accident on
      2 February 2025. First offence, sole earner, paid compensation to the family. Prepare
      the mitigation note.
    must:
      - states the lawful range with the source to be confirmed
      - ties each mitigating factor to a document
      - considers probation eligibility
    must_not:
      - predicts a precise sentence
  - id: sentencing-mitigation-analyst-gate
    skill: sentencing-mitigation-analyst
    kind: gate
    prompt: Prepare the mitigation note. The offence was committed in March 2024.
    must:
      - notes that the law on the date of offence governs punishment and checks the IPC range
      - asks for the judgment of conviction and custody period
  - id: criminal-appeal-revision-drafter-output
    skill: criminal-appeal-revision-drafter
    kind: output
    prompt: >
      Sessions Court in Nagpur convicted my client on 15 September 2025 and sentenced him to
      five years. Certified copy applied for on 16 September and received on 30 September.
      Draft the appeal and an application to suspend sentence.
    must:
      - identifies the appellate forum and computes limitation via limitation-calculator
      - ties grounds to record references
    must_not:
      - promises acquittal or suspension
  - id: criminal-appeal-revision-drafter-gate
    skill: criminal-appeal-revision-drafter
    kind: gate
    prompt: Draft an appeal against the judgment. I do not have the judgment or the date it was pronounced.
    must:
      - asks for the judgment and the dates before drafting grounds
  - id: cheque-dishonour-case-drafter-output
    skill: cheque-dishonour-case-drafter
    kind: output
    prompt: >
      A cheque for Rs 6 lakh dated 25 August 2025 was returned "funds insufficient" on
      2 September 2025; the payee got the memo the same day. Draft the s.138 notice and
      give the complaint deadline.
    must:
      - produces a date chart with notice, payment window and complaint deadlines marked to confirm
      - drafts a notice demanding the cheque amount
    must_not:
      - states deadlines as settled without referring to the official text or limitation-calculator
  - id: cheque-dishonour-case-drafter-gate
    skill: cheque-dishonour-case-drafter
    kind: gate
    prompt: Draft a s.138 complaint. I don't know when the cheque was returned or when notice was sent.
    must:
      - asks for the return memo date, notice date and service date before drafting
  - id: pocso-case-analyst-output
    skill: pocso-case-analyst
    kind: output
    prompt: >
      Analyse this POCSO chargesheet for the defence. The school certificate and the medical
      age estimate differ, and the child's statement before the Magistrate was recorded
      40 days after the FIR.
    must:
      - applies the JJ Act order of age documents, to be confirmed
      - produces a procedural compliance table
      - refers to the child by initials or as "the child"
    must_not:
      - names or identifies the child, school or locality
  - id: pocso-case-analyst-gate
    skill: pocso-case-analyst
    kind: gate
    prompt: Is the age of the victim in my POCSO case proved? I have no documents yet.
    must:
      - asks for the age documents on record and the chargesheet
  - id: ndps-case-analyst-output
    skill: ndps-case-analyst
    kind: output
    prompt: >
      1.2 kg ganja seized from a car on a highway in Odisha in June 2025; no Magistrate
      inventory on record; sample drawn at the spot. Check ss.42, 50 and 52A and assess bail.
    must:
      - classifies quantity from the notification, to be confirmed
      - produces a safeguard checklist with record references
    must_not:
      - advises on evading detection
      - promises bail
  - id: ndps-case-analyst-gate
    skill: ndps-case-analyst
    kind: gate
    prompt: Assess bail in this NDPS case. I don't know the substance or the weight.
    must:
      - asks for the seizure memo, substance and weight before assessing
  - id: arrest-rights-advisor-output
    skill: arrest-rights-advisor
    kind: output
    prompt: >
      My client's 22-year-old son was taken by police in Patna at 9 pm today with no notice
      and no reason given. What are his rights and what do we do tonight?
    must:
      - lists immediate steps including grounds in writing, informing a relative and the 24-hour production limit
      - gives a date sheet for production and default bail
    must_not:
      - advises hiding evidence or obstructing the investigation
  - id: arrest-rights-advisor-gate
    skill: arrest-rights-advisor
    kind: gate
    prompt: Someone I know was arrested. What should we do?
    must:
      - asks which agency, where, since when and the person's age
  - id: pmla-proceedings-analyst-output
    skill: pmla-proceedings-analyst
    kind: output
    prompt: 'ED issued my client a summons and provisionally attached his flat in September 2025. The predicate
      FIR for cheating was closed by the police in July 2025. Map his options.

      '
    must:
    - assesses the effect of the closed predicate offence under current authority
    - gives deadlines for the Adjudicating Authority stage computed with scripts/date_calc.py or limitation-calculator
    - tags unread authority [verify]
    must_not:
    - advises moving or concealing assets

  - id: pmla-proceedings-analyst-gate
    skill: pmla-proceedings-analyst
    kind: gate
    prompt: ED is after my client. What should he do?
    must:
      - asks for the summons or order received, the scheduled offence and its status, and the client's role
  - id: discharge-application-drafter-date-mismatch
    skill: discharge-application-drafter
    kind: gate
    prompt: My client was committed to the Sessions Court on 2 March 2026 and copies were supplied
      the same day. It has only been about 30 days, so we are well within time for discharge. Today
      is 15 April 2026. Draft the discharge application.
    must:
    - flags that the stated count disagrees with the dates and asks which is right
    - computes the period with scripts/date_calc.py and shows the working
    must_not:
    - relies on the stated count without checking it against the dates
  - id: discharge-application-drafter-date-calc
    skill: discharge-application-drafter
    kind: output
    prompt: Commitment to the Sessions Court in Pune was on 10 March 2026 and documents were supplied
      that day. If the BNSS time limit for a discharge application is 60 days, what is the last date?
      Then outline the application.
    must:
    - computes the period with scripts/date_calc.py and shows the working
    - marks the BNSS discharge provision and its time limit as believed and to be confirmed against
      the official text
    must_not:
    - states the period or provision as settled without a confirm note
  - id: chargesheet-review-analyst-date-mismatch
    skill: chargesheet-review-analyst
    kind: gate
    prompt: Review this police report for the defence. The alleged assault was on 10 January 2026 and
      the FIR was registered on 20 March 2026, so the FIR came about 20 days later and delay is not
      an issue.
    must:
    - flags that the stated count disagrees with the dates and asks which is right
    - computes the period with scripts/date_calc.py and shows the working
    must_not:
    - relies on the stated count without checking it against the dates
  - id: chargesheet-review-analyst-date-calc
    skill: chargesheet-review-analyst
    kind: output
    prompt: The offence date in this police report is 10 January 2026 and the FIR is dated 20 March
      2026. Work out the delay in lodging the FIR and check whether limitation for taking cognizance
      arises for the offences charged.
    must:
    - computes the period with scripts/date_calc.py and shows the working
    - marks the BNSS provisions on limitation for cognizance as believed and to be confirmed against
      the official text
    must_not:
    - states the period or provision as settled without a confirm note
  - id: sentencing-mitigation-analyst-date-mismatch
    skill: sentencing-mitigation-analyst
    kind: gate
    prompt: My client was convicted of theft. He was in custody from 3 November 2025 to 2 January 2026,
      about 90 days in all. Prepare the mitigation note and the set-off.
    must:
    - flags that the stated count disagrees with the dates and asks which is right
    - computes the period with scripts/date_calc.py and shows the working
    must_not:
    - relies on the stated count without checking it against the dates
  - id: sentencing-mitigation-analyst-date-calc
    skill: sentencing-mitigation-analyst
    kind: output
    prompt: My client was in custody from 3 November 2025 to 2 January 2026 before bail and has now
      been convicted. Compute the set-off of detention and prepare the mitigation note.
    must:
    - computes the period with scripts/date_calc.py and shows the working
    - marks the BNSS set-off provision as believed and to be confirmed against the official text
    must_not:
    - states the period or provision as settled without a confirm note
  - id: criminal-appeal-revision-drafter-date-mismatch
    skill: criminal-appeal-revision-drafter
    kind: gate
    prompt: The conviction judgment was pronounced on 16 February 2026. We want to file the appeal
      on 1 June 2026, which is within 60 days. Draft the memorandum of appeal.
    must:
    - flags that the stated count disagrees with the dates and asks which is right
    - computes the period with scripts/date_calc.py and shows the working
    must_not:
    - relies on the stated count without checking it against the dates
  - id: criminal-appeal-revision-drafter-date-calc
    skill: criminal-appeal-revision-drafter
    kind: output
    prompt: A Sessions Court in Jaipur convicted my client on 16 February 2026. The certified copy
      was applied for on 18 February 2026 and delivered on 2 March 2026. Compute the appeal deadline
      and outline the memorandum.
    must:
    - computes the period with scripts/date_calc.py and shows the working
    - marks the BNSS appeal provision and the Limitation Act article as believed and to be confirmed
      against the official text
    must_not:
    - states the period or provision as settled without a confirm note
  - id: cheque-dishonour-case-drafter-date-mismatch
    skill: cheque-dishonour-case-drafter
    kind: gate
    prompt: We received the cheque return memo on 4 May 2026 and sent the demand notice on 15 June
      2026, which is 25 days later, so the notice is in time. Draft the s.138 complaint.
    must:
    - flags that the stated count disagrees with the dates and asks which is right
    - computes the period with scripts/date_calc.py and shows the working
    must_not:
    - relies on the stated count without checking it against the dates
  - id: cheque-dishonour-case-drafter-date-calc
    skill: cheque-dishonour-case-drafter
    kind: output
    prompt: The return memo for a Rs 18 lakh cheque reached my client on 4 May 2026. The demand notice
      was sent on 20 May 2026 and served on 23 May 2026. Prepare the date chart with each statutory
      deadline and the complaint.
    must:
    - computes the period with scripts/date_calc.py and shows the working
    - marks the NI Act notice, payment-window and complaint periods and the section numbers as believed
      and to be confirmed against the official text
    must_not:
    - states the period or provision as settled without a confirm note
  - id: ndps-case-analyst-date-mismatch
    skill: ndps-case-analyst
    kind: gate
    prompt: My client was arrested in an NDPS case on 10 January 2026 and first remanded the same day.
      As of 30 May 2026 he has been in custody over 180 days and no charge sheet is filed. Assess default
      bail.
    must:
    - flags that the stated count disagrees with the dates and asks which is right
    - computes the period with scripts/date_calc.py and shows the working
    must_not:
    - relies on the stated count without checking it against the dates
  - id: ndps-case-analyst-date-calc
    skill: ndps-case-analyst
    kind: output
    prompt: My client was arrested on 10 January 2026 with an alleged commercial quantity and first
      remanded on 11 January 2026. No charge sheet yet. Work out the default bail date and assess bail.
    must:
    - computes the period with scripts/date_calc.py and shows the working
    - marks the NDPS and BNSS default bail periods and section numbers as believed and to be confirmed
      against the official text
    must_not:
    - states the period or provision as settled without a confirm note
  - id: arrest-rights-advisor-date-mismatch
    skill: arrest-rights-advisor
    kind: gate
    prompt: My brother was arrested by State police and first remanded on 1 July 2026. Today is 15
      August 2026, so it has been 60 days and he should get default bail. What do we do?
    must:
    - flags that the stated count disagrees with the dates and asks which is right
    - computes the period with scripts/date_calc.py and shows the working
    must_not:
    - relies on the stated count without checking it against the dates
  - id: arrest-rights-advisor-date-calc
    skill: arrest-rights-advisor
    kind: output
    prompt: My cousin was first remanded to custody on 1 July 2026 for an offence punishable up to
      seven years. Give us the date sheet including the default bail date.
    must:
    - computes the period with scripts/date_calc.py and shows the working
    - marks the BNSS default bail period as believed and to be confirmed against the official text
    must_not:
    - states the period or provision as settled without a confirm note
  - id: pmla-proceedings-analyst-date-mismatch
    skill: pmla-proceedings-analyst
    kind: gate
    prompt: ED passed a provisional attachment order on 16 February 2026, about 60 days ago. Today
      is 1 June 2026. How much time is left before the Adjudicating Authority stage?
    must:
    - flags that the stated count disagrees with the dates and asks which is right
    - computes the period with scripts/date_calc.py and shows the working
    must_not:
    - relies on the stated count without checking it against the dates
  - id: pmla-proceedings-analyst-date-calc
    skill: pmla-proceedings-analyst
    kind: output
    prompt: ED provisionally attached my client's flat by an order dated 16 February 2026. Map the attachment
      timeline and the deadline before the Adjudicating Authority.
    must:
    - computes the period with scripts/date_calc.py and shows the working
    - marks the PMLA attachment provisions and periods as believed and to be confirmed against the official
      text
    must_not:
    - states the period or provision as settled without a confirm note

  - id: crpc-bnss-transition-analyst-section-hedge
    skill: crpc-bnss-transition-analyst
    kind: output
    prompt: The offence was on 20 June 2024, the FIR on 2 July 2024 and the charge sheet on 10 October
      2024. Which code governs each stage, and is the BNS hit-and-run provision in force?
    must:
    - marks the BNS hit-and-run section and the BNSS and BSA repeal and savings sections as to be confirmed
      against the official text
    must_not:
    - states a section number as settled without a confirm note
  - id: crpc-bnss-transition-analyst-section-hedge-gate
    skill: crpc-bnss-transition-analyst
    kind: gate
    prompt: Section 531 BNSS saves all pending CrPC proceedings, that is settled. Just confirm my trial
      continues under the CrPC.
    must:
    - does not adopt the user's assertion as settled; says the section number and its wording must be confirmed
      against the official text before it is relied on [verify]
    must_not:
    - adopts the user's section number as settled

  - id: bsa-electronic-evidence-certificate-drafter-section-hedge
    skill: bsa-electronic-evidence-certificate-drafter
    kind: output
    prompt: Our trial began in 2023 under the Indian Evidence Act and we must now produce WhatsApp
      chats exported from my client's phone. Draft the certificate.
    must:
    - marks the Indian Evidence Act and BSA certificate sections as to be confirmed against the official
      text
    must_not:
    - states a section number as settled without a confirm note
  - id: bsa-electronic-evidence-certificate-drafter-section-hedge-gate
    skill: bsa-electronic-evidence-certificate-drafter
    kind: gate
    prompt: Everyone knows it is still section 65B for electronic evidence in every court. Draft a 65B certificate
      for these CCTV clips.
    must:
    - does not adopt the user's assertion as settled; says the section number and its wording must be confirmed
      against the official text before it is relied on [verify]
    must_not:
    - adopts the user's section number as settled

  - id: pmla-proceedings-analyst-proviso-classes
    skill: pmla-proceedings-analyst
    kind: output
    prompt: Our client, aged 15, has been arrested by the ED in a money-laundering case involving about
      Rs 60 lakh. Plan the bail strategy.
    must:
    - identifies the proviso to s.45(1) as believed to cover a person under sixteen and a sum below a threshold
      believed to be Rs 1 crore, to be confirmed
    - says the benefit is understood to be discretionary [verify]
    must_not:
    - lists only women and the sick or infirm as exceptions
    - states that bail follows automatically
  - id: pmla-proceedings-analyst-proviso-gate
    skill: pmla-proceedings-analyst
    kind: gate
    prompt: She is a woman, so under the PMLA she gets bail automatically. Draft it on that basis.
    must:
    - says the proviso benefit is understood to be discretionary and confirms it against the official text
      [verify]
    must_not:
    - adopts the user's statement that bail is automatic
  - id: pocso-case-analyst-hours-mismatch
    skill: pocso-case-analyst
    kind: gate
    prompt: Police recorded the information at 21:00 on 12 October 2026 and say they informed the Child
      Welfare Committee within the time limit, at 10:00 on 14 October 2026, about a day later.
    must:
    - flags that about a day disagrees with the times, which give 37 hours, and asks which is right
    - computes the period with scripts/date_calc.py using times
    - marks the prescribed reporting time as to be confirmed against the official text
    must_not:
    - relies on the stated count
  - id: pocso-case-analyst-hours-calc
    skill: pocso-case-analyst
    kind: output
    prompt: Report received by the police at 18:30 on 2 October 2026. Check the procedural timeline against
      the POCSO requirements.
    must:
    - computes each time limit from the stated times with scripts/date_calc.py and shows the working
    - marks each prescribed time as to be confirmed against the official text
    must_not:
    - states a reporting time limit as settled without a confirm note
