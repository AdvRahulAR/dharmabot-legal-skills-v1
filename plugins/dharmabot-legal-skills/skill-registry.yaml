    pack: criminal-bnss
    jurisdiction: in
    practice_area: evidence
    category: drafting
    language: [en]
    default_prompt: Prepare the BSA certificate for these WhatsApp chats exported from my client's phone.
    hands_off_to: [pre-filing-verification-checker]
