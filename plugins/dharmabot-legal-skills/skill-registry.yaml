skills:
  # ---------------- criminal-bnss ----------------
  - id: ipc-bns-concordance-mapper
    display_name: IPC–BNS Concordance Mapper
    short: Map IPC, CrPC and Evidence Act sections to BNS, BNSS and BSA
    pack: criminal-bnss
    jurisdiction: in
    practice_area: criminal
    category: research
    language: [en]
    default_prompt: Map these IPC and CrPC sections to the BNS and BNSS and note what changed.
    hands_off_to: [crpc-bnss-transition-analyst, fir-ingredients-analyst]
  - id: crpc-bnss-transition-analyst
    display_name: CrPC–BNSS Transition Analyst
    short: Decide whether old or new criminal codes govern each stage
    pack: criminal-bnss
    jurisdiction: in
    practice_area: criminal
    category: analysis
    language: [en]
    default_prompt: Work out whether the CrPC or BNSS governs each stage of this case from these dates.
    hands_off_to: [bnss-bail-application-drafter, fir-ingredients-analyst, bsa-electronic-evidence-certificate-drafter]
  - id: bnss-bail-application-drafter
    display_name: BNSS Bail Application Drafter
    short: Draft regular or anticipatory bail applications under the BNSS
    pack: criminal-bnss
    jurisdiction: in
    practice_area: criminal
    category: drafting
    language: [en]
    shared_scripts: [date_calc.py]
    default_prompt: Draft an anticipatory bail application from this FIR for the Sessions Court.
    hands_off_to: [undertrial-release-screener, arrest-rights-advisor, court-pleading-formatter, regional-language-legal-drafter, citation-verifier, pre-filing-verification-checker]
  - id: fir-ingredients-analyst
    display_name: FIR Ingredients Analyst
    short: Test FIR allegations against each offence's ingredients
    pack: criminal-bnss
    jurisdiction: in
    practice_area: criminal
    category: analysis
    language: [en]
    default_prompt: Check whether the facts in this FIR make out each offence charged.
    hands_off_to: [bnss-bail-application-drafter]
  - id: bsa-electronic-evidence-certificate-drafter
    display_name: BSA Electronic Evidence Certificate Drafter
