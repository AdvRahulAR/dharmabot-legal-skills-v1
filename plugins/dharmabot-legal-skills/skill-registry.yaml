# Source of truth for skill metadata. Edit here, then run:
#   python3 scripts/build.py
# which regenerates each skill's skill.meta.yaml, agents/openai.yaml and
# references/ and scripts/ copies of shared files (shared_refs, shared_scripts),
# and the catalogue in README.md.
# SKILL.md frontmatter stays name + description only.
